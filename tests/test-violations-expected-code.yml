name: Test violations with expected return code 2
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          override_version: v26.11.1
          working_directory: ${{ github.workspace }}/tests/fixtures/violations
          args: playbook.yml
          expected_return_code: "2"
      - name: Assert action succeeded (lint returned the expected code 2)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
