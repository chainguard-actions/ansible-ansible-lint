name: Test bad playbook with expected_return_code 2
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create isolated lint project with violations
        run: |
          set -e
          PROJ="$RUNNER_TEMP/lint-project"
          rm -rf "$PROJ"
          mkdir -p "$PROJ"
          cd "$PROJ"
          git init -q .
          cat > playbook.yml <<'EOF'
          ---
          - hosts: localhost
            tasks:
              - shell: echo hi
          EOF
          cat playbook.yml
      - id: action
        uses: .
        with:
          override_version: v26.10.0
          working_directory: ${{ runner.temp }}/lint-project
          args: playbook.yml
          expected_return_code: "2"
      - name: Assert action succeeded because lint violations matched expected code
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
