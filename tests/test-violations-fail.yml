name: Test violations fail the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          override_version: v26.11.0
          working_directory: tests/fixtures/bad
          args: "-c .ansible-lint playbook.yml"
      - name: Assert action failed due to lint violations
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for playbook with violations"
            exit 1
          fi
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v ansible-lint >/dev/null 2>&1; then
            echo "FAIL: failure was not caused by linting (ansible-lint not installed)"
            exit 1
          fi
          echo "PASS"
