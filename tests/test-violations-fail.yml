name: Test violations fail the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          override_version: v26.11.1
          working_directory: ${{ github.workspace }}/tests/fixtures/violations
          args: playbook.yml
      - name: Assert action failed due to lint violations
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a playbook with violations"
            exit 1
          fi
          # Ensure the failure came from linting, not installation
          if ! command -v ansible-lint >/dev/null 2>&1; then
            echo "FAIL: ansible-lint was not installed; failure was not from linting"
            exit 1
          fi
          echo "PASS"
