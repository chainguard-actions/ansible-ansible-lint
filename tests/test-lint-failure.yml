name: Test bad playbook fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create isolated lint project with violations
        run: |
          set -e
          PROJ="$RUNNER_TEMP/lint-project"
          rm -rf "$PROJ"
          mkdir -p "$PROJ"
          cd "$PROJ"
          git init -q .
          cat > playbook.yml <<'EOF'
          ---
          - hosts: localhost
            tasks:
              - shell: echo hi
          EOF
          cat playbook.yml
      - id: action
        uses: .
        continue-on-error: true
        with:
          override_version: v26.10.0
          working_directory: ${{ runner.temp }}/lint-project
          args: playbook.yml
      - name: Assert action failed and lint itself reports violations
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for playbook with violations"
            exit 1
          fi
          # Confirm the failure was due to lint violations, not install problems
          if ! command -v ansible-lint >/dev/null 2>&1; then
            echo "FAIL: ansible-lint was not installed; failure was not from linting"
            exit 1
          fi
          cd "$RUNNER_TEMP/lint-project"
          rc=0
          ansible-lint playbook.yml || rc=$?
          echo "ansible-lint rc: $rc"
          if [ "$rc" != "2" ]; then
            echo "FAIL: expected ansible-lint rc 2"
            exit 1
          fi
          echo "PASS"
